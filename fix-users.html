<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réparation utilisateurs Firestore</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .btn { padding: 12px 24px; font-size: 16px; color: white; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; }
    .btn-blue { background: #2563eb; } .btn-blue:hover { background: #1d4ed8; }
    .btn-gray { background: #6b7280; } .btn-gray:hover { background: #4b5563; }
    #log { margin-top: 20px; padding: 16px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; min-height: 80px; }
    .ok { color: #16a34a; } .err { color: #dc2626; } .info { color: #2563eb; }
  </style>
</head>
<body>
  <h2>Gestion utilisateurs — Boutiques Lycée</h2>
  <p>Document Firestore : <code>boutique_data/users</code></p>
  <button class="btn btn-gray" onclick="lireUsers()">Lire l'état actuel</button>
  <button class="btn btn-blue" onclick="ecraseUsers()">Écraser avec la liste officielle</button>
  <div id="log">Cliquez sur un bouton pour commencer.</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9qadE1xaVj1vGN8GxcReP5rUkQkNbYg4",
      authDomain: "boutiques-lycee.firebaseapp.com",
      projectId: "boutiques-lycee",
      storageBucket: "boutiques-lycee.firebasestorage.app",
      messagingSenderId: "339009074786",
      appId: "1:339009074786:web:fd617ac3b8df504b00433b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const OFFICIAL_USERS = [
      { id: 1,  nom: "", prenom: "Admin",     login: "admin",     mdp: "admin123",    role: "admin",        boutiques: ["peda", "locale"], actif: true },
      { id: 2,  nom: "", prenom: "Arnaud",    login: "Arnaud",    mdp: "Arnaud123",   role: "admin",        boutiques: ["peda", "locale"], actif: true },
      { id: 3,  nom: "", prenom: "Anne",      login: "Anne",      mdp: "Anne123",     role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 4,  nom: "", prenom: "Alain",     login: "Alain",     mdp: "Alain123",    role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 5,  nom: "", prenom: "Delphine",  login: "Delphine",  mdp: "Delphine123", role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 6,  nom: "", prenom: "Florim",    login: "Florim",    mdp: "Florim123",   role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 7,  nom: "", prenom: "Yann",      login: "Yann",      mdp: "Yann123",     role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 8,  nom: "", prenom: "Jean-Marc", login: "Jean-Marc", mdp: "JeanMarc123", role: "gestionnaire", boutiques: ["peda", "locale"], actif: true },
      { id: 9,  nom: "", prenom: "Annick",    login: "Annick",    mdp: "Annick123",   role: "comptable",    boutiques: ["peda", "locale"], actif: true },
      { id: 10, nom: "", prenom: "École",     login: "Ecole",     mdp: "Ecole 123",   role: "ecole",        boutiques: ["peda", "locale"], actif: true },
    ];

    const logEl = document.getElementById('log');
    const log = (msg, cls = '') => { logEl.innerHTML += `<span class="${cls}">${msg}\n</span>`; };

    window.lireUsers = async function() {
      logEl.innerHTML = '';
      try {
        log('Lecture de boutique_data/users...', 'info');
        const snap = await getDoc(doc(db, "boutique_data", "users"));
        if (!snap.exists()) {
          log('Document ABSENT.', 'err');
        } else {
          const data = snap.data().data;
          if (!data || data.length === 0) {
            log('Document présent mais VIDE.', 'err');
          } else {
            log(`${data.length} utilisateur(s) trouvé(s) :`, 'ok');
            data.forEach(u => log(`  • login="${u.login}"  mdp="${u.mdp}"  role="${u.role}"  actif=${u.actif}`));
          }
        }
      } catch (err) {
        log('ERREUR : ' + err.message, 'err');
      }
    };

    window.ecraseUsers = async function() {
      logEl.innerHTML = '';
      try {
        log('Écriture de la liste officielle dans boutique_data/users...', 'info');
        await setDoc(doc(db, "boutique_data", "users"), { data: OFFICIAL_USERS });
        log('Écrit avec succès !', 'ok');
        log('');
        log('Vérification :');
        const snap = await getDoc(doc(db, "boutique_data", "users"));
        snap.data().data.forEach(u => log(`  • login="${u.login}"  mdp="${u.mdp}"  role="${u.role}"`));
        log('');
        log('Rechargez maintenant l\'application.', 'ok');
      } catch (err) {
        log('ERREUR : ' + err.message, 'err');
        console.error(err);
      }
    };
  </script>
</body>
</html>
